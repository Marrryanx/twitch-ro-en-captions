<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RO→EN Captions</title>
<link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <!-- This view is rendered as a transparent Video Overlay on top of the player.
       It shows nothing until the first caption arrives. -->
  <div id="caption-root" class="caption-root" aria-live="polite">
    <div id="caption-box" class="caption-box hidden">
      <span class="badge">RO→EN</span>
      <span id="caption-text" class="caption-text"></span>
    </div>
  </div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
